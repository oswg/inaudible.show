<footer class="site-footer">
  <div class="footer-content">
    <p class="footer-tagline">{{ site.tagline | default: site.description }}</p>
    {% if site.email %}
    <p class="footer-contact">Contact: <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    {% endif %}
    <p class="footer-copy">&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</p>
  </div>
</footer>
